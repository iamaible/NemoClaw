apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nemoclaw.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
data:
  # OpenShell gateway endpoint consumed by SandboxClient / PolicyClient etc.
  OPENSHELL_ENDPOINT: {{ .Values.openshell.endpoint | quote }}

  # TLS paths — mounted from the client secret by the Deployment.
  OPENSHELL_TLS_CERT: {{ printf "%s/tls.crt" .Values.openshell.tls.mountPath | quote }}
  OPENSHELL_TLS_KEY:  {{ printf "%s/tls.key" .Values.openshell.tls.mountPath | quote }}
  OPENSHELL_TLS_CA:   {{ printf "%s/ca.crt"  .Values.openshell.tls.mountPath | quote }}

  # NemoClaw state paths.
  NEMOCLAW_STATE_DIR:     {{ .Values.nemoclaw.stateDir | quote }}
  NEMOCLAW_REGISTRY_FILE: {{ printf "%s/%s" .Values.nemoclaw.stateDir .Values.nemoclaw.registryFile | quote }}
  NEMOCLAW_SNAPSHOTS_DIR: {{ printf "%s/.nemoclaw/snapshots" .Values.nemoclaw.stateDir | quote }}

  # Python log level (DEBUG / INFO / WARNING / ERROR).
  NEMOCLAW_LOG_LEVEL: {{ .Values.nemoclaw.logLevel | quote }}
