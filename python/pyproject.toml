[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemoclaw"
version = "0.1.0"
description = "NemoClaw Python SDK — blueprint orchestration and sandbox management for Kubernetes deployments."
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "NVIDIA Inc." }]
requires-python = ">=3.12"
dependencies = [
    "openshell>=0.0.37",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
source = "https://github.com/NVIDIA/NemoClaw"
documentation = "https://docs.nvidia.com/nemoclaw/latest/"

[tool.hatch.build.targets.wheel]
packages = ["nemoclaw"]

[tool.uv.sources]
# Local path dependency during development; replace with a pinned PyPI version
# once the extended openshell SDK is published.
openshell = { path = "../../Openshell/python", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nemoclaw", "openshell"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["nemoclaw"]
python_files = ["*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
